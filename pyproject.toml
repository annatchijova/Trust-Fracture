[project]
name = "trust-fracture"
version = "0.1.0"
description = "Graph-based investigation of trust-boundary violations in AI agent systems"
requires-python = ">=3.12"
dependencies = [
    "relate-db==1.2.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
]

[project.scripts]
trust-fracture = "trust_fracture.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
